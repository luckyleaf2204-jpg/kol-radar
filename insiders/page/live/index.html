<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080b">
  <title>New Coins LIVE · KOL-Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/live/live.css?v=__V__">
</head>
<body>
  <header class="hd">
    <div class="brand">KOL<span>-</span>RADAR</div>
    <div id="live" class="live off"><i></i><b>…</b></div>
    <nav class="tabs" id="tabs"><button data-view="coins">NEW COINS</button><button data-view="wallets">VÍ THEO DÕI</button></nav>
    <div class="grow"></div>
    <div class="menu"><button id="mbtn" class="ghost" aria-haspopup="true">Nghiên cứu ▾</button>
      <div id="mlist" class="pop" hidden>
        <a href="/early/">Early Smart Money</a>
        <a href="/dashboard/">Dashboard Insiders cũ</a>
        <a href="/callers/">Smart Caller Hunter</a>
        <a href="#report" id="rep">Báo cáo quan sát tín hiệu</a>
      </div></div>
  </header>
  <main class="wrap">
    <section class="main" id="cview">
      <div class="tiles" id="tiles"></div>
      <div class="bar">
        <div class="chips" id="sig"></div>
        <div class="grow"></div>
        <div class="menu"><button id="fbtn" class="ghost">Bộ lọc ▾ <span id="fcount"></span></button>
          <div id="fpop" class="pop filt" hidden>
            <label>Tuổi coin <span class="seg" id="age"></span></label>
            <label>SOL vào ≥ <select id="minsol"><option>0</option><option>0.5</option><option>2</option><option>5</option><option>20</option></select></label>
            <label>Smart Money ≥ <select id="minsm"><option>0</option><option>1</option><option>2</option></select></label>
            <label class="chk"><input type="checkbox" id="hasbuy"> Chỉ coin đã có lệnh mua</label>
            <label class="chk"><input type="checkbox" id="norisk"> Ẩn coin có cảnh báo rủi ro</label>
            <label class="chk"><input type="checkbox" id="snd"> Âm báo khi có Smart Money / High Alert</label>
            <input id="q" type="search" placeholder="Tìm symbol, tên hoặc mint…">
          </div></div>
      </div>
      <div class="list">
        <div class="lh"><span>Coin mới nhất</span><span>Tín hiệu</span><span class="r">MC</span><span class="r">Liq</span><span class="r">Vol</span><span class="r">Buyers</span><span class="r">Smart</span><span>Rủi ro</span></div>
        <div id="rows"></div>
        <div id="empty" class="emptyst"></div>
      </div>
    </section>
    <section class="main" id="wview" hidden></section>
    <aside id="side" class="side" hidden></aside>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/live/live.js?v=__V__" defer></script>
</body>
</html>
