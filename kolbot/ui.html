<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOL Radar</title>
<style>
:root{
  --bg:#0b0d12;--panel:#12151d;--panel2:#171b25;--line:#232838;--text:#e7eaf2;--muted:#8a91a6;--faint:#5f6679;
  --accent:#7c5cff;--gain:#3ecf8e;--loss:#ff6b72;--warn:#f5b84b;--chip:#1d2230;
  --gainbar:#3987e5;--lossbar:#e5484d;--neutral:#5c6378;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
a.lk{color:#b9a8ff}a.lk:hover{text-decoration:underline}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
header{position:sticky;top:0;z-index:10;background:rgba(11,13,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-weight:750;font-size:17px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}.dot.on{background:var(--gain);box-shadow:0 0 0 4px rgba(62,207,142,.15)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(124,92,255,.18);color:#b9a8ff}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav a.on{background:var(--panel2);color:var(--text)}
.right{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;gap:12px;align-items:center}
main{max-width:1500px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.up{color:var(--gain)}.down{color:var(--loss)}.mut{color:var(--muted)}.faint{color:var(--faint)}
.mono{font-family:var(--mono);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.grid4{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.grid2,.grid4{grid-template-columns:1fr}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 10px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;font-size:11.5px;z-index:1;cursor:default}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td.num,th.num{text-align:right}
tbody tr:hover{background:rgba(124,92,255,.06)}
tr.click{cursor:pointer}
.rank{font-weight:750;color:var(--muted)}
.big{font-weight:750}
.b{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.3px;cursor:help;border:1px solid transparent}
.b.PASS{background:rgba(62,207,142,.15);color:var(--gain);border-color:rgba(62,207,142,.4)}
.b.PROVISIONAL{background:rgba(124,92,255,.16);color:#c3b5ff;border-color:rgba(124,92,255,.4)}
.b.INCONCLUSIVE{background:rgba(245,184,75,.13);color:var(--warn);border-color:rgba(245,184,75,.35)}
.b.REJECT{background:rgba(255,107,114,.13);color:var(--loss);border-color:rgba(255,107,114,.35)}
.r{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;cursor:help}
.r.u{background:var(--chip);color:var(--muted)}.r.l{background:rgba(62,207,142,.14);color:var(--gain)}
.r.m{background:rgba(245,184,75,.14);color:var(--warn)}.r.h{background:rgba(255,107,114,.14);color:var(--loss)}
.r.x{background:rgba(255,107,114,.28);color:#ffd0d3}
.kd{display:inline-block;font-size:10.5px;font-weight:750;padding:1px 6px;border-radius:5px;margin-right:4px}
.kd.known{background:rgba(245,184,75,.16);color:var(--warn)}.kd.new{background:var(--chip);color:var(--muted)}
.lown{font-size:10.5px;color:var(--warn);margin-left:4px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted);font-size:12.5px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.podium{grid-template-columns:1fr}}
.pod{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.pod:hover{border-color:var(--accent)}
.pod .m{font-size:22px}.pod .n{font-weight:700;margin:4px 0 2px}.pod .p{font-size:18px;font-weight:750}
.list .it{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}
.chart{position:relative;height:190px}
.chart svg{width:100%;height:100%;display:block}
.tip{position:fixed;z-index:30;pointer-events:none;background:#0f121a;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.note{color:var(--faint);font-size:12px;line-height:1.5}
.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.alert{border:1px solid rgba(245,184,75,.45);background:rgba(245,184,75,.08);border-radius:12px;padding:10px 12px;margin:8px 0}
.alert.bad{border-color:rgba(255,107,114,.5);background:rgba(255,107,114,.08)}
.wl{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;margin:10px 0 6px}
.wl div{height:100%}
.back{color:var(--muted);font-size:13px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.hero .kpi{background:var(--panel2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.card.held{box-shadow:inset 3px 0 0 var(--accent)}
.top{display:flex;gap:11px;align-items:center}
.img{width:44px;height:44px;border-radius:11px;background:var(--chip) center/cover no-repeat;flex:none}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cg .m{background:var(--panel2);border-radius:9px;padding:6px 8px}.cg .k{font-size:10.5px;color:var(--muted)}.cg .v{font-weight:650}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12px;display:inline-block;margin:0 4px 4px 0}
.fi{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.side{font-size:10.5px;font-weight:750;padding:2px 0;border-radius:6px;text-align:center}
.side.buy{background:rgba(62,207,142,.15);color:var(--gain)}.side.sell{background:rgba(255,107,114,.15);color:var(--loss)}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#gate button{background:var(--accent);border:0;font-weight:650}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:760px){
  .hm{display:none}
  .cg{grid-template-columns:repeat(2,1fr)}
  th,td{padding:7px 6px}
  .right .hm{display:none}
}
</style>
</head>
<body>
<div id="gate"><form onsubmit="return saveCode(event)"><div class="brand">KOL Radar <span class="tag">PAPER</span></div>
  <div class="mut">Nhập mã truy cập</div><input id="code" type="password" autocomplete="current-password" required>
  <button type="submit">Vào</button><div class="faint" id="gateMsg"></div></form></div>
<header><div class="bar">
  <div class="brand"><span class="dot" id="dot"></span>KOL Radar <span class="tag">PAPER</span></div>
  <nav id="nav">
    <a href="#/kols" data-t="kols">KOLs</a><a href="#/devs" data-t="devs">Devs</a><a href="#/tokens" data-t="tokens">Tokens</a>
    <a href="#/trades" data-t="trades">Trades</a><a href="#/live" data-t="live">Live</a>
  </nav>
  <div class="right"><span id="sol"></span><span class="hm" id="stream"></span></div>
</div></header>
<main id="app"><div class="empty">Đang tải…</div></main>
<div class="tip" id="tip"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), app=$('app'), tip=$('tip');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SOLUSD=null, STATUS=null, timer=null, ROUTE='';
const BADIMG=new Set();   // image hosts that refuse cross-origin loads: never retried
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const F=Object.assign({group:'kol',range:'all',min_n:1,pnl:'',status:'',sort:'pnl',dir:'desc',page:1},store.get('kolF',{}));

/* ---------- formatting ---------- */
function sh(a,n=4){return a?a.slice(0,n)+'…'+a.slice(-4):''}
function num(x,d=2){return x==null||!isFinite(x)?'–':Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function sol(x,d=3){if(x==null||!isFinite(x))return'<span class="faint">–</span>';const c=x>0?'up':x<0?'down':'mut';
  const u=SOLUSD?` <span class="faint">≈ ${usd(x*SOLUSD)}</span>`:'';
  return `<span class="${c}">${x>0?'▲ +':x<0?'▼ −':''}${num(Math.abs(x),d)} SOL</span>${u}`}
function solPlain(x,d=3){if(x==null||!isFinite(x))return'–';return `<span class="${x>0?'up':x<0?'down':'mut'}">${x>0?'+':x<0?'−':''}${num(Math.abs(x),d)}</span>`}
function usd(x){if(x==null||!isFinite(x))return'–';const a=Math.abs(x);return(x<0?'−':'')+'$'+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(a<10?2:0))}
function pct(x,d=1){if(x==null||!isFinite(x))return'<span class="faint">–</span>';return `<span class="${x>0?'up':x<0?'down':'mut'}">${x>0?'+':x<0?'−':''}${num(Math.abs(x),d)}%</span>`}
function rate(x){return x==null?'<span class="faint">–</span>':num(100*x,0)+'%'}
function mc(s){return s==null?'–':SOLUSD?usd(s*SOLUSD):num(s,1)+' SOL'}
function dt(ts){if(!ts)return'–';const d=new Date(ts*1000);return d.toLocaleDateString('vi-VN')+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function day(ts){return ts?new Date(ts*1000).toLocaleDateString('vi-VN'):'–'}
function ago(ts,now){if(!ts)return'–';const s=Math.max(0,Math.round((now||Date.now()/1000)-ts));return s<60?s+'s':s<3600?Math.floor(s/60)+' phút':s<86400?Math.floor(s/3600)+' giờ':Math.floor(s/86400)+' ngày'}
function span(a,b){if(!a||!b)return'–';const s=b-a;return s<3600?Math.round(s/60)+' phút':s<86400?(s/3600).toFixed(1)+' giờ':(s/86400).toFixed(1)+' ngày'}
const SDESC={PASS:'PASS: đạt tiêu chí đã đăng ký (n ≥ 100, CI 95% > 0 VÀ thắng nhóm control p < 0.05). Dashboard không tự gán PASS vì bot paper chưa có nhóm control.',
  PROVISIONAL:'PROVISIONAL: n ≥ 100 và cận dưới CI 95% > 0, nhưng thiếu nhóm control ngẫu nhiên nên CHƯA phải PASS.',
  INCONCLUSIVE:'INCONCLUSIVE: n < 100 lệnh — chưa đủ mẫu để kết luận, kể cả khi đang lãi.',
  REJECT:'REJECT: n ≥ 100 nhưng cận dưới CI 95% ≤ 0 — không chứng minh được lãi sau chi phí.'};
function badge(s){return `<span class="b ${s}" title="${esc(SDESC[s]||s)}" onclick="alert(this.title)">${s}</span>`}
const RCLS={'UNKNOWN':'u','LOW RISK':'l','MEDIUM RISK':'m','HIGH RISK':'h','REPEAT FAILURE':'h','SUSPICIOUS / RUG HISTORY':'x'};
function risk(r,why){return `<span class="r ${RCLS[r]||'u'}" title="${esc(why||r)}">${esc(r||'UNKNOWN')}</span>`}
function devTag(d){if(!d||!d.creator)return'<span class="faint">–</span>';
  return `<span class="kd ${d.known_dev?'known':'new'}">${d.known_dev?'KNOWN DEV':'NEW DEV'}</span><a class="lk mono" href="#/dev/${d.creator}" onclick="event.stopPropagation()" title="${esc(d.creator)}">${sh(d.creator)}</a> ${risk(d.risk,d.risk_reason)}`}
function lowN(n){return n<10?`<span class="lown" title="Mẫu rất nhỏ (n < 10): con số dao động mạnh, không đáng tin">n thấp</span>`:''}
function walletLinks(w,url){return `<span class="mono" title="${esc(w)}">${sh(w,6)}</span> <button onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(w)}');this.textContent='✓'" title="Copy">⧉</button> <a class="lk" href="${esc(url)}" target="_blank" rel="noopener">Solscan ↗</a>`}
function pager(p,fn){if(!p||p.pages<=1)return `<div class="pager">${p?p.total.toLocaleString()+' dòng':''}</div>`;
  return `<div class="pager"><span>${p.total.toLocaleString()} dòng · trang ${p.page}/${p.pages}</span>
   <button ${p.page<=1?'disabled':''} onclick="${fn}(1)">«</button><button ${p.page<=1?'disabled':''} onclick="${fn}(${p.page-1})">‹</button>
   <button ${p.page>=p.pages?'disabled':''} onclick="${fn}(${p.page+1})">›</button><button ${p.page>=p.pages?'disabled':''} onclick="${fn}(${p.pages})">»</button></div>`}
function seg(name,opts,cur,fn){return `<div class="seg" role="group" aria-label="${name}">${opts.map(([v,l])=>`<button class="${String(v)===String(cur)?'on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`}

/* ---------- api ---------- */
function getCode(){try{return localStorage.getItem('kolCode')||''}catch(e){return window._code||''}}
function saveCode(e){e.preventDefault();const v=$('code').value;try{localStorage.setItem('kolCode',v)}catch(_){window._code=v}
  $('gate').style.display='none';route();return false}
async function api(path,params={}){
  const q=new URLSearchParams(Object.entries(params).filter(([k,v])=>v!==''&&v!=null)).toString();
  const r=await fetch(path+(q?'?'+q:''),{cache:'no-store',headers:{'X-Access-Code':getCode()}});
  if(r.status===401){$('gate').style.display='flex';$('gateMsg').textContent=getCode()?'Mã không đúng':'';throw new Error('auth')}
  return r.json()}
async function status(){try{STATUS=await api('/api/status');SOLUSD=STATUS.sol_usd;
  const live=STATUS.live&&STATUS.connected&&STATUS.last_event_age_s!=null&&STATUS.last_event_age_s<60;
  $('dot').className='dot'+(live?' on':'');$('sol').textContent=SOLUSD?'SOL $'+SOLUSD.toFixed(2):'';
  $('stream').textContent=!STATUS.live?'stream tắt (chế độ xem dữ liệu)':live?`stream live · ${(STATUS.events||0).toLocaleString()} sự kiện`:'stream mất kết nối'}catch(e){}}

/* ---------- charts (inline SVG, single series each, hover on every chart) ---------- */
function showTip(ev,html){tip.innerHTML=html;tip.style.display='block';const x=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(ev.clientY+14)+'px'}
function hideTip(){tip.style.display='none'}
function lineChart(el,pts,title){
  if(!pts||pts.length<2){el.innerHTML='<div class="empty">Chưa đủ dữ liệu để vẽ</div>';return}
  const W=el.clientWidth||600,H=el.clientHeight||190,L=56,R=10,T=10,B=22;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let y0=Math.min(0,...ys),y1=Math.max(0,...ys);if(y0===y1)y1=y0+1;
  const x0=xs[0],x1=xs[xs.length-1]||x0+1;const X=t=>L+(W-L-R)*((t-x0)/((x1-x0)||1)),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const last=ys[ys.length-1],col=last>=0?'var(--gainbar)':'var(--lossbar)';
  const ticks=[y0,(y0+y1)/2,y1];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" fill="var(--faint)" font-size="10.5" text-anchor="end">${num(v,2)}</text>`).join('')}
   <line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--neutral)" stroke-width="1" stroke-dasharray="3 3"/>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
   <text x="${L}" y="${H-5}" fill="var(--faint)" font-size="10.5">${day(x0)}</text><text x="${W-R}" y="${H-5}" fill="var(--faint)" font-size="10.5" text-anchor="end">${day(x1)}</text>
   <line id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
   <circle id="xd" r="4" fill="${col}" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>
   <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg>`;
  const svg=el.querySelector('svg'),xh=svg.querySelector('#xh'),xd=svg.querySelector('#xd');
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width;let i=0,b=1e18;
    pts.forEach((p,k)=>{const dd=Math.abs(X(p[0])-mx);if(dd<b){b=dd;i=k}});const p=pts[i];
    xh.setAttribute('x1',X(p[0]));xh.setAttribute('x2',X(p[0]));xh.setAttribute('visibility','visible');
    xd.setAttribute('cx',X(p[0]));xd.setAttribute('cy',Y(p[1]));xd.setAttribute('visibility','visible');
    showTip(e,`${dt(p[0])}<br>P&L tích lũy: ${solPlain(p[1],4)} SOL`)};
  svg.onmouseleave=()=>{xh.setAttribute('visibility','hidden');xd.setAttribute('visibility','hidden');hideTip()}}
function barChart(el,bars,opt){
  if(!bars||!bars.length){el.innerHTML='<div class="empty">Chưa có dữ liệu</div>';return}
  const W=el.clientWidth||600,H=el.clientHeight||190,L=40,R=8,T=10,B=22,n=bars.length,mx=Math.max(...bars.map(b=>b.v),1);
  const bw=Math.max(2,(W-L-R)/n-2),Y=v=>T+(H-T-B)*(1-v/mx);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title)}">
   ${[0,mx/2,mx].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" fill="var(--faint)" font-size="10.5" text-anchor="end">${Math.round(v)}</text>`).join('')}
   ${bars.map((b,i)=>{const x=L+i*(W-L-R)/n+1,h=Math.max(0,H-B-Y(b.v)),r=Math.min(4,bw/2,h);

     ${t.dev_sold?'<span class="r h">Dev đã bán</span>':''}
     ${t.paper?`<div class="alert" style="border-color:rgba(124,92,255,.5);background:rgba(124,92,255,.08)">Bot giấy đang giữ (copy ${esc(t.paper.kol)}) · vào ${mc(t.paper.entry_mc_sol)} · ${pct(t.paper.pct)}</div>`:''}</div>`};
  app.innerHTML=`<div class="grid2" style="grid-template-columns:minmax(0,1fr) 360px"><div><h2><span>KOL đang bắt coin nào</span><span>${S.tokens.length} coin</span></h2>
    <div class="cards">${S.tokens.map(card).join('')||'<div class="empty">Chưa có KOL nào mua trong lúc bot chạy</div>'}</div>
    <div class="note" style="margin-top:8px">"Người đang xem" pump.fun không công khai — thay bằng số ví trade 5 phút và số bình luận.</div></div>
   <div><div class="panel"><h2><span>Luồng lệnh KOL</span><span class="faint">live</span></h2><div style="max-height:600px;overflow:auto">
    ${S.feed.map(a=>`<div class="fi"><span class="side ${a.side}">${a.side==='buy'?'MUA':'BÁN'}</span><div><a class="lk" href="#/kol/${a.kol}"><b>${esc(a.name)}</b></a> <span class="faint">${a.sol} SOL</span><br><span class="faint">${esc(a.symbol?'$'+a.symbol:sh(a.mint))} · MC ${mc(a.mc_sol)}</span></div><span class="faint">${ago(a.ts,S.now)}</span></div>`).join('')||'<div class="faint">Chưa có lệnh</div>'}</div></div></div></div>`;
}

/* ---------- router ---------- */
async function route(){
  clearTimeout(timer);hideTip();
  const h=location.hash||'#/kols',[path,qs]=h.slice(2).split('?'),parts=path.split('/');
  const t=parts[0]||'kols';ROUTE=t;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===({kol:'kols',dev:'devs',token:'tokens'}[t]||t)));
  if(t==='trades'&&qs){const p=new URLSearchParams(qs);if(p.get('kol')){RF.kol=p.get('kol');RF.page=1;history.replaceState(null,'','#/trades')}}
  try{await status();
    if(t==='kols')await viewKols();else if(t==='kol')await viewKol(parts[1]);else if(t==='devs')await viewDevs();
    else if(t==='dev')await viewDev(parts[1]);else if(t==='tokens')await viewTokens();else if(t==='token')await viewToken(parts[1]);
    else if(t==='trades')await viewTrades();else if(t==='live')await viewLive();else location.hash='#/kols';
  }catch(e){if(e.message!=='auth'){app.innerHTML=`<div class="empty">Lỗi tải dữ liệu: ${esc(e.message)}</div>`}return}
  timer=setTimeout(()=>{if(!document.querySelector('input:focus,select:focus'))route();else timer=setTimeout(route,15000)},t==='live'?3000:20000);
}
window.addEventListener('hashchange',()=>{KD.page=1;DD.page=1;route()});
window.addEventListener('resize',()=>{clearTimeout(window._rs);window._rs=setTimeout(route,300)});
route();
</script>
